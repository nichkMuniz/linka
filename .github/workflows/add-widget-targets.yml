name: Add Widget Extension targets to Xcode project

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to commit the result to'
        required: true
        default: 'main'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  add-targets:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Show repo root (debug)
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "---"
          ls ios/ || echo "no ios/ folder"
          echo "---"
          ls ios/App/ || echo "no ios/App/ folder"

      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: Run add_widget_targets.rb
        run: ruby ios/add_widget_targets.rb

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ios/App/App.xcodeproj/project.pbxproj
          git add ios/App/LinkaWorkoutWidget/Info.plist 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing changed — targets were already present."
          else
            git commit -m "feat(ios): add LinkaWorkoutWidget and LinkaWorkoutPlugin Xcode targets"
            git push origin ${{ github.event.inputs.branch }}
            echo "Committed and pushed."
          fi
